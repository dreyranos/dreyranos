name: Gerar Puzzle Bobble

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Gerar Puzzle Bobble SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
          games: 'puzzle-bobble'
          hide_month_labels: 'false'

      - name: Pedir para a Vercel ignorar esta branch
        run: |
          mkdir -p dist
          printf '%s\n' '{ "ignoreCommand": "exit 0" }' > dist/vercel.json

      - name: Enviar SVG para a branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
