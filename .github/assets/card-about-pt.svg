<svg width="840" height="230" viewBox="0 0 840 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassBg" x1="0" y1="0" x2="840" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="specularBorder" x1="0" y1="0" x2="840" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 40) scale(220 120)">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(740 190) scale(240 130)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="838" height="228" rx="18" fill="url(#glassBg)" />
  <rect x="1" y="1" width="838" height="228" rx="18" fill="url(#orb1)" />
  <rect x="1" y="1" width="838" height="228" rx="18" fill="url(#orb2)" />
  <rect x="1" y="1" width="838" height="228" rx="18" stroke="url(#specularBorder)" stroke-width="1.5" />
  <line x1="24" y1="1.5" x2="816" y2="1.5" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1" />

  <style>
    .label { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #7dd3fc; }
    .val { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #e2e8f0; }
    .bio { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #cbd5e1; }
  </style>

  <text x="28" y="38" class="label">🏗️ Stack: <tspan class="val">Desenvolvimento Full-Stack & Systems</tspan></text>
  <text x="28" y="64" class="label">⏳ Experiência: <tspan class="val">4+ anos em TI / Dev</tspan></text>
  <text x="28" y="90" class="label">📍 Base: <tspan class="val">Brasil</tspan></text>
  <text x="28" y="116" class="label">🤖 IA Assistant: <tspan class="val">Cursor (Dev Workflows)</tspan></text>

  <text x="360" y="38" class="label">🎯 Foco: <tspan class="val">APIs back-end, refatoração de legado e mobile</tspan></text>
  <text x="360" y="64" class="label">💬 Status: <tspan class="val">aberto a projetos e desafios técnicos</tspan></text>
  <text x="360" y="90" class="label">✨ Lema: <tspan class="val">código limpo, escalável e eficiente</tspan></text>

  <line x1="28" y1="138" x2="812" y2="138" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1" />

  <text x="28" y="166" class="bio">Atuo de ponta a ponta na engenharia, otimização e manutenção de sistemas complexos: do banco relacional</text>
  <text x="28" y="188" class="bio">ao app em produção, desenvolvendo APIs, regras de negócio multi-tenant e automações de código que</text>
